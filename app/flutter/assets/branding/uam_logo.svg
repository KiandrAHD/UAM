<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">UAM — Universe Audio Management</title>
  <desc id="desc">Blue gradient U monogram with two wireless earbuds and audio wave accents.</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="36" x2="448" y2="476" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111D2D"/>
      <stop offset="1" stop-color="#07111E"/>
    </linearGradient>
    <linearGradient id="blue" x1="98" y1="92" x2="416" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#45D7FF"/>
      <stop offset=".48" stop-color="#168BEA"/>
      <stop offset="1" stop-color="#0754C7"/>
    </linearGradient>
    <linearGradient id="bud" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E6FBFF"/>
      <stop offset="1" stop-color="#65CFFF"/>
    </linearGradient>
    <filter id="glow" x="30" y="20" width="452" height="470" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 .03 0 0 0 0 .56 0 0 0 0 1 0 0 0 .46 0" result="colored"/>
      <feMerge><feMergeNode in="colored"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bg)"/>
  <rect x="17" y="17" width="478" height="478" rx="127" stroke="#29445E" stroke-opacity=".72" stroke-width="2"/>
  <g filter="url(#glow)">
    <!-- U-shaped sonic cradle -->
    <path d="M122 132v133c0 111 54 167 134 167s134-56 134-167V132h-72v132c0 66-17 99-62 99s-62-33-62-99V132h-72Z" fill="url(#blue)"/>
    <!-- Earbud housings -->
    <g fill="url(#bud)">
      <path d="M147 92c-27 0-49 22-49 49v24c0 19 15 34 34 34h8c13 0 23-10 23-23v-35c0-8 6-14 14-14h11c7 0 13-6 13-13s-6-13-13-13h-41Z"/>
      <path d="M365 92c27 0 49 22 49 49v24c0 19-15 34-34 34h-8c-13 0-23-10-23-23v-35c0-8-6-14-14-14h-11c-7 0-13-6-13-13s6-13 13-13h41Z"/>
    </g>
    <g fill="#0B4E91" opacity=".9">
      <circle cx="148" cy="141" r="7"/><circle cx="364" cy="141" r="7"/>
    </g>
    <!-- Wave accents -->
    <g fill="none" stroke="#67E4FF" stroke-width="11" stroke-linecap="round" opacity=".94">
      <path d="M75 244c-12 19-12 45 0 64"/>
      <path d="M437 244c12 19 12 45 0 64"/>
    </g>
    <g fill="#DFFAFF">
      <circle cx="75" cy="226" r="5"/><circle cx="437" cy="326" r="5"/>
    </g>
  </g>
</svg>
