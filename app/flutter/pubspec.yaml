name: uam
description: Universe Audio Management Phase 1 foundation, responsive UI, and Flutter-Rust bridge integration.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  crypto: ^3.0.6
  ffi: ^2.1.4
  file_selector: ^1.0.4
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite_common_ffi: ^2.4.7
  sqlite3_flutter_libs: ^0.5.39

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/branding/uam_logo.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf