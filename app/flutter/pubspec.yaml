name: uam
description: Universe Audio Management Phase 1 foundation, responsive UI, and Flutter-Rust bridge integration.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  ffi: ^2.1.4
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/branding/uam_logo.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf