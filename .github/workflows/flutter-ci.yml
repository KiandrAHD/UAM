name: Flutter CI

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "app/flutter/**"
      - "crates/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    paths:
      - "app/flutter/**"
      - "crates/**"
      - ".github/workflows/flutter-ci.yml"

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      # Build the native library so the live Flutter-Rust bridge test runs
      # instead of being skipped. Linux builds a .so with the default toolchain.
      - name: Build Rust FFI library
        working-directory: crates
        run: cargo build --locked -p uam_ffi

      - name: Resolve Flutter dependencies
        working-directory: app/flutter
        run: flutter pub get

      - name: Format check
        working-directory: app/flutter
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        working-directory: app/flutter
        run: flutter analyze

      - name: Test
        working-directory: app/flutter
        env:
          UAM_FFI_LIBRARY_PATH: ${{ github.workspace }}/crates/target/debug/libuam_ffi.so
        run: flutter test