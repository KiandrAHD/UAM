[package]
name = "uam-audio-diagnostics"
version = "0.0.0"
edition = "2021"
publish = false
description = "Phase 0 read-only Windows audio device diagnostics for UAM."

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[[bin]]
name = "uam-audio-diagnostics"
path = "src/main.rs"
